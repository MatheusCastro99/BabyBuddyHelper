# Dependabot version updates, BabyBuddyHelper.
# Minor and patch bumps are grouped into ONE pull request per ecosystem, so the
# ruleset's "branch must be up to date" rule only has to be satisfied once
# instead of once per dependency. Major bumps are not grouped: each one stays
# its own PR so it gets its own review (.NET, MAUI and Syncfusion majors in particular).
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Security updates for any NuGet package, in one PR
      nuget-security:
        applies-to: security-updates
        patterns:
          - "*"
      # Routine minor/patch bumps, in one PR
      nuget-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
