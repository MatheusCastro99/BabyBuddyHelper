name: Build Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - stage
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore
      
      - name: Build
        env:
          # Baked into the app by the GenerateBuildSecrets target. Empty when the secret is absent: the build
          # still succeeds and the app simply runs unlicensed.
          # Pull request builds deliberately get no secret: a PR can change the MSBuild targets, which would
          # otherwise let it read the key. Only push, workflow_dispatch and release builds are licensed.
          SYNCFUSION_LICENSE: ${{ github.event_name != 'pull_request' && secrets.SYNCFUSION_LICENSE || '' }}
        run: dotnet build `
                -f net10.0-windows10.0.19041.0 `
                -c Release
