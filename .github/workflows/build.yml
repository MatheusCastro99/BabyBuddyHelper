name: Build Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - stage
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore
      
      - name: Build
        # CI builds unlicensed on purpose: nothing it builds is kept or shipped, so no job gets SYNCFUSION_LICENSE.
        # The release pipelines (#173 Android, #178 Windows) supply the key to the builds that ship.
        # The project is named because the solution also holds the test project, which has no Windows target (#104)
        run: dotnet build BabyBuddyHelper.csproj `
                -f net10.0-windows10.0.19041.0 `
                -c Release

  # Ubuntu on purpose: on Linux the project's only target is net10.0-android (see the csproj).
  # Release, like the build Phase 8 ships, so trimming runs here too. No iOS or Mac Catalyst until v1.1.
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android Workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore BabyBuddyHelper.csproj

      # CI builds unlicensed on purpose (see windows-build): no secret reaches this job.
      - name: Build
        run: dotnet build BabyBuddyHelper.csproj -f net10.0-android -c Release
