name: Build Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - stage
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore
      
      - name: Build
        env:
          # Baked into the app by the GenerateBuildSecrets target. Empty when the secret is absent: the build
          # still succeeds and the app simply runs unlicensed.
          SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}
        run: dotnet build `
                -f net10.0-windows10.0.19041.0 `
                -c Release
