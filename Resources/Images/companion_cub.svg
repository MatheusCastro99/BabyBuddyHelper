<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Lion cub companion - warm, friendly, non-distracting artwork -->

  <!-- Tail -->
  <path d="M142 150 Q178 142 166 116" fill="none" stroke="#E8A857" stroke-width="10" stroke-linecap="round"/>
  <circle cx="166" cy="116" r="8" fill="#8A5A34"/>

  <!-- Body -->
  <ellipse cx="100" cy="148" rx="52" ry="36" fill="#F9C87B"/>
  <ellipse cx="100" cy="155" rx="34" ry="20" fill="#FCEBCB"/>

  <!-- Paws -->
  <ellipse cx="74" cy="177" rx="15" ry="12" fill="#F9C87B"/>
  <ellipse cx="126" cy="177" rx="15" ry="12" fill="#F9C87B"/>
  <ellipse cx="74" cy="180" rx="8" ry="5" fill="#FCEBCB"/>
  <ellipse cx="126" cy="180" rx="8" ry="5" fill="#FCEBCB"/>

  <!-- Ears -->
  <circle cx="62" cy="52" r="18" fill="#E8A857"/>
  <circle cx="138" cy="52" r="18" fill="#E8A857"/>
  <circle cx="62" cy="52" r="9" fill="#FCEBCB"/>
  <circle cx="138" cy="52" r="9" fill="#FCEBCB"/>

  <!-- Head -->
  <circle cx="100" cy="88" r="44" fill="#F9C87B"/>

  <!-- Muzzle -->
