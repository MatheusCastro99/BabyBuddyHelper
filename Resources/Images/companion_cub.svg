  <!-- Mouth -->
  <path d="M100 101 Q100 109 91 108" fill="none" stroke="#8A5A34" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M100 101 Q100 109 109 108" fill="none" stroke="#8A5A34" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cheeks -->
  <circle cx="75" cy="100" r="5.5" fill="#F4A3A3" opacity="0.55"/>
  <circle cx="125" cy="100" r="5.5" fill="#F4A3A3" opacity="0.55"/>
