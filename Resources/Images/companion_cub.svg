  <!-- Eyes -->
  <circle cx="84" cy="86" r="4.5" fill="#23415D"/>
  <circle cx="116" cy="86" r="4.5" fill="#23415D"/>
  <circle cx="85.5" cy="84.5" r="1.3" fill="#FFFFFF"/>
  <circle cx="117.5" cy="84.5" r="1.3" fill="#FFFFFF"/>

  <!-- Nose -->
